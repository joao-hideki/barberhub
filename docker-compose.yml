services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: barberhub
      POSTGRES_USER: ${POSTGRES_USER:-barberhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env (veja .env.example)}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d barberhub"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    environment:
      ConnectionStrings__Default: Host=db;Database=barberhub;Username=${POSTGRES_USER:-barberhub};Password=${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
